# Vorlage fuer die Secrets (Streamlit Cloud: App, Settings, Secrets).
# NICHT ins Repository hochladen. Hashes mit passwort_hash_erzeugen.py erzeugen.

kunde = "Kundenname"          # erscheint erst nach der Anmeldung
sitzung_minuten = 60          # automatische Abmeldung nach Inaktivitaet

[nutzer."D. Karges"]
passwort_hash = "pbkdf2_sha256$600000$...$..."
rolle = "koordination"

[nutzer."A. Muster"]
passwort_hash = "pbkdf2_sha256$600000$...$..."
rolle = "mb"
